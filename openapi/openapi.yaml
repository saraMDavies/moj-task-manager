openapi: 3.1.0
info:
  title: Task Manager API
  version: 1.0.0
  description: CRUD API for managing tasks. Validation failures return 400 and unknown task ids return 404, both with an ErrorResponse body.
servers:
  - url: http://localhost:8080
tags:
  - name: Tasks
    description: Create, read, update and delete tasks
paths:
  /api/tasks:
    get:
      operationId: getTasks
      tags: [Tasks]
      summary: List all tasks
      responses:
        "200":
          description: All tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRequest" }
      responses:
        "201":
          description: The created task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get a task
      responses:
        "200":
          description: The requested task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateTask
      tags: [Tasks]
      summary: Replace a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRequest" }
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTask
      tags: [Tasks]
      summary: Delete a task
      responses:
        "204": { description: Task deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/tasks/{id}/status:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      operationId: updateTaskStatus
      tags: [Tasks]
      summary: Change a task's status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskStatusRequest" }
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Task identifier
      schema: { type: integer, format: int64 }
  schemas:
    TaskRequest:
      type: object
      description: Fields a client can set on a task
      required: [title, status, due]
      properties:
        title: { type: string, minLength: 1, maxLength: 50 }
        description: { type: [string, "null"], maxLength: 255 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        due:
          type: string
          format: date-time
          description: When the task is due, as an RFC 3339 timestamp with offset, for example 2026-10-23T09:00:00+01:00
    Task:
      description: A stored task, including its server-assigned id
      allOf:
        - $ref: "#/components/schemas/TaskRequest"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64, readOnly: true }
    UpdateTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TaskStatus" }
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable explanation of the failure
  responses:
    BadRequest:
      description: The request body failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: No task exists with the given id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
